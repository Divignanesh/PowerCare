<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Per-page SEO lives in src/components/seo/SEO.jsx: title, description,
      canonical, robots, Open Graph, Twitter and JSON-LD. The build
      pre-renders every route (scripts/prerender.mjs), so those tags are in
      each page's HTML for crawlers that never run JavaScript. Nothing
      page-specific is set here, or it would duplicate Helmet's copy; the
      title below is only the fallback for the app shell.
    -->
    <title data-ssr>PowerCare Health Services</title>
    <meta name="author" content="PowerCare Health Services" />

    <!-- Browser chrome -->
    <meta name="theme-color" content="#001E38" />
    <meta name="format-detection" content="telephone=yes" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="CA-ON" />
    <meta name="geo.placename" content="Greater Toronto Area, Ontario, Canada" />
    <meta name="ICBM" content="43.6532, -79.3832" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BZ17CM9PXR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-BZ17CM9PXR');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
