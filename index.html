    <!--
      Primary SEO.
      description, robots and canonical are deliberately NOT set here: they are
      per-page and react-helmet-async owns them. A static copy would sit in the
      DOM alongside Helmet's, and a second canonical pointing at "/" would tell
      Google every inner page is a duplicate of the home page.

      The og:* and twitter:* tags below stay static because social crawlers do
      not execute JavaScript and would otherwise see nothing at all.
    -->
